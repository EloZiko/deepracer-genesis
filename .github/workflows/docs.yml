name: docs

# Build the mkdocs site and publish it to GitHub Pages.
# Pages source must be set to "GitHub Actions" (repo Settings > Pages, or
#   gh api -X POST repos/Luna-v0/deepracer-genesis/pages -f build_type=workflow).
# The build needs NO heavy deps (torch/genesis): mkdocstrings parses the source
# statically via `paths: [.]` in mkdocs.yml, so only the docs tools are installed.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "deepracer_genesis/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build site
        # not --strict: 61 incomplete-annotation warnings would fail it, but a
        # genuinely broken ::: module reference still aborts the build regardless.
        run: >-
          uv run --no-project
          --with mkdocs-material --with 'mkdocstrings[python]'
          mkdocs build --site-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
