[project]
name = "deepracer-genesis"
version = "0.1.1"
description = "AWS DeepRacer RL environment ported to Genesis (ROS-free, GPU-batched, vision-based, RSL-RL)"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 1.2.3 pins quadrants 1.1.1, which fixes the GPU allocator memory-safety
    # bugs behind the sporadic DR CUDA_ERROR_ILLEGAL_ADDRESS + NaN'd physics.
    "genesis-world>=1.2.3",
    "rsl-rl-lib>=5.4.0",
    "torch>=2.5",
    "tensordict>=0.7",
    "tensorboard",
    "pillow",
    "numpy",
    "pyarrow",
    "imageio[ffmpeg]",
]

[project.urls]
Homepage = "https://github.com/Luna-v0/deepracer-genesis"
Repository = "https://github.com/Luna-v0/deepracer-genesis"
Documentation = "https://luna-v0.github.io/deepracer-genesis/"

[project.optional-dependencies]
# camera observations. gs-madrona (batch renderer) and gs-nyx (path tracer) are
# GPU-only and version-coupled to genesis; the lower bounds are the versions
# verified against genesis 1.3.x (nyx needs genesis>=1.3.1, resolved via its own
# pin). Install with e.g.  uv add "deepracer-genesis[vision] @ git+<url>"
vision = ["gs-madrona>=0.0.10"]
nyx = ["gs-nyx>=0.1.4", "gs-nyx-plugin>=0.1.5"]
tracking = ["mlflow"]
hpo = ["optuna"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepracer_genesis*"]

[tool.setuptools.package-data]
deepracer_genesis = ["assets/**/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    # gs-madrona bundles nvJitLink 12.4 but prefers the system libnvrtc.so.13 at
    # runtime; on a CUDA-13 toolkit that mismatch breaks the batch renderer's
    # megakernel link. Pinning NVRTC 12.4 here keeps `uv sync` from pruning it
    # (it silently did, breaking camera rendering). Pairs with
    # scripts/fix_madrona_cuda13.sh (symlinks + dlopen-name patch).
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    "catppuccin-jupyterlab>=0.2.5",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter-collaboration>=4.4.1",
    "jupyter-mcp-tools>=0.1.6",
    "jupyterlab>=4.6.1",
    "jupyterlab-git>=0.54.0",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-vim>=4.1.4",
    "jupytext>=1.19.4",
    "lckr-jupyterlab-variableinspector>=3.2.4",
    "pycrdt>=0.13.1",
    "python-lsp-server[all]>=1.14.0",
]
